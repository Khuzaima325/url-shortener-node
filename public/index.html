<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; padding: 1rem; }
    main { width: 100%; max-width: 520px; text-align: center; }
    h1 { margin-bottom: .5rem; }
    p { color: #94a3b8; margin-bottom: 1.5rem; }
    form { display: flex; flex-direction: column; gap: .5rem; }
    input { padding: .8rem 1rem; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 1rem; }
    button { padding: .8rem; border: none; border-radius: 8px; background: #0284c7; color: #fff; font-size: 1rem; cursor: pointer; }
    #output { margin-top: 1.25rem; word-break: break-all; }
    #output a { color: #38bdf8; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>🔗 URL Shortener</h1>
    <p>Paste a long URL, get a short link. Links live in memory while the server runs.</p>
    <form id="form">
      <input id="url" type="url" placeholder="https://example.com/a/very/long/link" required>
      <input id="custom" type="text" placeholder="Custom code (optional, 3-30 chars)">
      <button type="submit">Shorten</button>
    </form>
    <div id="output"></div>
  </main>
  <script>
    const form = document.getElementById("form");
    const output = document.getElementById("output");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      output.textContent = "Working…";
      try {
        const res = await fetch("/api/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: document.getElementById("url").value, custom: document.getElementById("custom").value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to shorten.");
        output.innerHTML = `Short link: <a href="${data.shortUrl}" target="_blank" rel="noopener">${data.shortUrl}</a>`;
      } catch (err) {
        output.innerHTML = `<span class="error">${err.message}</span>`;
      }
    });
  </script>
</body>
</html>
